name: Verify public-chain forks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.1
      - run: npm ci --ignore-scripts
      - run: npm run test:fork
